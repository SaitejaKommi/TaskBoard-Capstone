name: TaskBoard CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ── JOB 1: Test ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -v --tb=short

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ── JOB 2: Build, Scan, Push ─────────────────────────────────────────────────
  build-scan-push:
    name: Build / Scan / Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image variables
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${OWNER}/taskboard-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER}/taskboard-frontend" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_BACKEND }}:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_FRONTEND }}:latest \
            ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Push backend image to GHCR
        run: |
          docker push ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_BACKEND }}:latest

      - name: Push frontend image to GHCR
        run: |
          docker push ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_FRONTEND }}:latest

  # ── JOB 3: Deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Deploy with Helm
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 5m
