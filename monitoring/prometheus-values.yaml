# Prometheus Helm values for TaskBoard monitoring
# Deploy with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install prometheus prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f monitoring/prometheus-values.yaml

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    retention: 7d
    resources:
      requests:
        memory: 400Mi
      limits:
        memory: 1Gi

grafana:
  enabled: true
  adminPassword: taskboard-admin
  service:
    type: LoadBalancer
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: taskboard
          orgId: 1
          folder: TaskBoard
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/taskboard

alertmanager:
  enabled: true
